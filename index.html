<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDEgo | Universal DMV & CDL Search</title>
    <style>
        :root { --gde-blue: #002d62; --gde-gold: #ffcc00; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding-bottom: 60px; color: #333; }
        
        header { background: var(--gde-blue); color: white; padding: 45px 20px; text-align: center; border-bottom: 6px solid var(--gde-gold); }
        h1 { margin: 0; font-size: 3em; letter-spacing: 2px; font-weight: 900; }
        .tagline { margin-top: 10px; font-size: 1.2em; color: #ccc; }

        .search-box-wrapper { position: sticky; top: 0; background: white; padding: 20px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .search-container { position: relative; width: 90%; max-width: 650px; }
        #searchField { width: 100%; padding: 18px 60px 18px 25px; border-radius: 50px; border: 3px solid var(--gde-blue); font-size: 1.2em; outline: none; box-sizing: border-box; transition: 0.3s; }
        
        .voice-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.6em; cursor: pointer; color: var(--gde-blue); }
        .listening { color: #d9534f; animation: flash 1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .main-container { max-width: 850px; margin: 30px auto; padding: 0 20px; }
        #resultsSummary { font-size: 1.1em; margin-bottom: 20px; font-weight: bold; color: #555; }
        
        .qa-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; border-left: 10px solid var(--gde-blue); box-shadow: 0 4px 8px rgba(0,0,0,0.04); }
        .meta-tags { margin-bottom: 12px; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; margin-right: 5px; color: white; }
        .tag-state { background: #5bc0de; }
        .tag-type { background: var(--gde-gold); color: #000; }
        
        .question-text { font-weight: 800; font-size: 1.3em; line-height: 1.4; color: #1a1a1a; margin-bottom: 15px; }
        .answer-heading { font-size: 0.8em; font-weight: bold; color: var(--gde-blue); text-transform: uppercase; margin-bottom: 6px; }
        .answer-text { background: #e6f2ff; color: #004085; padding: 18px; border-radius: 8px; font-weight: 700; font-size: 1.15em; border: 1px solid #b8daff; }
        
        .no-results { text-align: center; padding: 40px; font-size: 1.2em; color: #777; background: white; border-radius: 12px; }
    </style>
</head>
<body>

<header>
    <h1>GDEgo</h1>
    <div class="tagline">The Smart Keyword Search for Driver & CDL Written Exams</div>
</header>

<div class="search-box-wrapper">
    <div class="search-container">
        <input type="text" id="searchField" placeholder="Type keywords (e.g., 'stop sign', 'air brake')..." onkeyup="executeSearch()">
        <button class="voice-btn" id="micTrigger" onclick="activateVoiceSearch()">🎤</button>
    </div>
</div>

<div class="main-container">
    <div id="resultsSummary">Type above to search the database...</div>
    <div id="deckDisplay"></div>
</div>

<script>
    // MASSIVE EXPANDED QUESTION DATABASE
    const masterQuestionBank = [
        { state: "Ohio", type: "Regular Class D", q: "What should you do when approaching a stop sign?", a: "You must come to a complete stop behind the stop line, crosswalk, or before entering the intersection. Yield the right-of-way to pedestrians and oncoming vehicles before proceeding safely." },
        { state: "Ohio", type: "Regular Class D", q: "What is the legal speed limit in a school zone during recess or opening/closing hours?", a: "20 miles per hour (mph)." },
        { state: "Ohio", type: "Regular Class D", q: "When are you allowed to turn right on a red light in Ohio?", a: "After coming to a complete stop, yielding to pedestrians and cross traffic, as long as there is no sign prohibiting 'No Turn on Red'." },
        { state: "Ohio", type: "Regular Class D", q: "What is the 'Four-Second Rule' used for?", a: "To determine a safe following distance between your vehicle and the car directly ahead of you under normal driving conditions." },
        { state: "Ohio", type: "Regular Class D", q: "It is unlawful to park within how many feet of a fire hydrant?", a: "Within 10 feet of a fire hydrant." },
        { state: "Ohio", type: "Regular Class D", q: "What is the legal blood alcohol concentration (BAC) limit for drivers under the age of 21?", a: "0.02% or higher." },
        { state: "Ohio", type: "Regular Class D", q: "What must you do when a school bus is stopped with its red lights flashing on a road with fewer than four lanes?", a: "All drivers approaching from either direction must stop at least 10 feet away from the bus and remain stopped until the lights stop flashing." },
        { state: "Universal", type: "CDL Air Brakes", q: "At what pressure must the low air pressure warning system buzzer or light activate?", a: "The system must warn the driver before air pressure drops below 60 PSI." },
        { state: "Universal", type: "CDL Air Brakes", q: "What happens when the air pressure in an air brake vehicle drops down to 20 to 45 PSI?", a: "The spring brakes will automatically apply and pop out, locking the wheels to stop the vehicle." },
        { state: "Universal", type: "CDL Air Brakes", q: "What are the four steps of a static air brake check setup?", a: "1. Build air to governor cut-out (120-140 PSI), 2. Shut off engine, 3. Chock wheels and release parking brakes, 4. Fully apply foot brake and hold for 1 minute checking for leaks." },
        { state: "Universal", type: "CDL Pre-Trip", q: "How do you inspect the slack adjusters and pushrods on air brakes?", a: "Check for broken, loose, or missing parts. With the parking brakes released, pull the pushrod hard by hand—it should not move more than 1 inch." },
        { state: "Universal", type: "CDL General Knowledge", q: "What is the maximum legal height limit for a standard commercial trailer/truck configuration?", a: "13 feet, 6 inches." },
        { state: "Universal", type: "CDL General Knowledge", q: "What is the minimum depth required for tread on front/steer tires of a commercial motor vehicle?", a: "4/32 of an inch depth. All other tires require at least 2/32 of an inch." },
        { state: "Universal", type: "CDL General Knowledge", q: "How far ahead should a commercial driver look down the road while driving?", a: "12 to 15 seconds ahead, which equals roughly one city block at low speeds or a quarter-mile at highway speeds." },
        { state: "Universal", type: "CDL Class A", q: "Why must you check that the tractor fifth wheel jaws are closed locked tight around the kingpin?", a: "To guarantee the trailer is safely coupled and cannot separate or break away from the tractor during transit." },
        { state: "Universal", type: "CDL Class A", q: "What is the purpose of the emergency air line (the supply line) in a combination vehicle?", a: "It supplies high-pressure air to the trailer air tanks and controls the trailer emergency spring brakes." },
        { state: "Universal", type: "CDL Combination", q: "What is the danger of a trailer jackknife maneuver?", a: "A trailer jackknife occurs when the trailer wheels lock up, causing the trailer to swing out sideways out of its lane, pulling the tractor backward." }
    ];

    // RENDER ON LOAD
    displayCards(masterQuestionBank);

    function displayCards(data) {
        const display = document.getElementById('deckDisplay');
        const summary = document.getElementById('resultsSummary');
        display.innerHTML = "";

        if (data.length === 0) {
            summary.innerText = "0 Matches Found";
            display.innerHTML = `<div class="no-results">No matches found. Try typing simpler keywords like "stop", "brake", or "speed".</div>`;
            return;
        }

        summary.innerText = `Found ${data.length} matched exam question(s):`;

        data.forEach(item => {
            display.innerHTML += `
                <div class="qa-card">
                    <div class="meta-tags">
                        <span class="tag tag-state">${item.state}</span>
                        <span class="tag tag-type">${item.type}</span>
                    </div>
                    <div class="question-text">${item.q}</div>
                    <div class="answer-heading">Official Verified Answer:</div>
                    <div class="answer-text">${item.a}</div>
                </div>
            `;
        });
    }

    // SMART KEYWORD SEARCH ENGINE
    function executeSearch() {
        const query = document.getElementById('searchField').value.toLowerCase().trim();
        
        if (!query) {
            displayCards(masterQuestionBank);
            return;
        }

        // Break search input into separate words (e.g., "stop", "sign")
        const searchWords = query.split(/\s+/);

        const filteredResults = masterQuestionBank.filter(item => {
            const combinedText = (item.q + " " + item.a + " " + item.type + " " + item.state).toLowerCase();
            
            // The card matches only if EVERY keyword typed is found somewhere in the card text
            return searchWords.every(word => combinedText.includes(word));
        });

        displayCards(filteredResults);
    }

    // VOICE INTERACTION CONTROL
    function activateVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Voice features require Google Chrome on mobile devices.");
            return;
        }

        const recognizer = new SpeechRecognition();
        const mic = document.getElementById('micTrigger');
        const searchInput = document.getElementById('searchField');

        recognizer.lang = 'en-US';

        recognizer.onstart = () => {
            mic.classList.add('listening');
            searchInput.placeholder = "Listening...";
        };

        recognizer.onresult = (event) => {
            const vocalInput = event.results[0][0].transcript;
            searchInput.value = vocalInput;
            mic.classList.remove('listening');
            searchInput.placeholder = "Type keywords...";
            executeSearch();
        };

        recognizer.onerror = () => {
            mic.classList.remove('listening');
            searchInput.placeholder = "Type keywords...";
        };

        recognizer.start();
    }
</script>

</body>
</html>
