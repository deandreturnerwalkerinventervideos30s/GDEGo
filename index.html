<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDEgo | Universal DMV & CDL Search</title>
    <style>
        :root { --gde-blue: #002d62; --gde-gold: #ffcc00; --dark: #111; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding-bottom: 60px; color: #333; }
        
        /* Premium Header Styling */
        header { background: var(--gde-blue); color: white; padding: 50px 20px; text-align: center; border-bottom: 6px solid var(--gde-gold); }
        h1 { margin: 0; font-size: 3em; letter-spacing: 2px; font-weight: 900; }
        .tagline { margin-top: 10px; font-size: 1.2em; color: #ccc; }

        /* The Main Entry Search Bar */
        .search-box-wrapper { position: sticky; top: 0; background: white; padding: 20px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .search-container { position: relative; width: 90%; max-width: 650px; }
        #searchField { width: 100%; padding: 18px 60px 18px 25px; border-radius: 50px; border: 3px solid var(--gde-blue); font-size: 1.2em; outline: none; box-sizing: border-box; transition: 0.3s; }
        #searchField:focus { box-shadow: 0 0 15px rgba(0, 45, 98, 0.3); }
        
        /* Mic Button Styles */
        .voice-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.6em; cursor: pointer; color: var(--gde-blue); transition: 0.2s; }
        .voice-btn:hover { transform: translateY(-50%) scale(1.1); }
        .listening { color: #d9534f; animation: flash 1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Content Container */
        .main-container { max-width: 850px; margin: 30px auto; padding: 0 20px; }
        #resultsSummary { font-size: 1.1em; margin-bottom: 20px; font-weight: bold; color: #555; }
        
        /* Dynamic Q&A Cards */
        .qa-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; border-left: 10px solid var(--gde-blue); box-shadow: 0 4px 8px rgba(0,0,0,0.04); transition: 0.3s; }
        .qa-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .meta-tags { margin-bottom: 12px; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; margin-right: 5px; color: white; }
        .tag-state { background: #5bc0de; }
        .tag-type { background: var(--gde-gold); color: #000; }
        
        .question-text { font-weight: 800; font-size: 1.3em; line-height: 1.4; color: #1a1a1a; margin-bottom: 15px; }
        .answer-heading { font-size: 0.8em; font-weight: bold; color: var(--gde-blue); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .answer-text { background: #e6f2ff; color: #004085; padding: 18px; border-radius: 8px; font-weight: 700; font-size: 1.15em; border: 1px solid #b8daff; }
        
        .no-results { text-align: center; padding: 40px; font-size: 1.2em; color: #777; background: white; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.04); }
    </style>
</head>
<body>

<header>
    <h1>GDEgo</h1>
    <div class="tagline">The Universal Portal for Driver & CDL Written Exam Solutions</div>
</header>

<div class="search-box-wrapper">
    <div class="search-container">
        <input type="text" id="searchField" placeholder="Type or speak an exam question here..." onkeyup="executeSearch()">
        <button class="voice-btn" id="micTrigger" onclick="activateVoiceSearch()">🎤</button>
    </div>
</div>

<div class="main-container">
    <div id="resultsSummary">Showing all available test questions:</div>
    <div id="deckDisplay"></div>
</div>

<script>
    // MASTER QUESTION DATABASE
    // You can copy and paste this block to add thousands of rules, states, and certifications.
    const masterQuestionBank = [
        {
            state: "Ohio",
            type: "Regular Class D",
            q: "When you are closely following another vehicle at night, what headlights must you use?",
            a: "You must use your low-beam headlights to prevent blinding the driver ahead of you."
        },
        {
            state: "Ohio",
            type: "Regular Class D",
            q: "It is unlawful to park within how many feet of a fire hydrant?",
            a: "Within 10 feet of a fire hydrant."
        },
        {
            state: "Universal",
            type: "CDL General Knowledge",
            q: "What is the maximum legal height for a standard commercial vehicle?",
            a: "13 feet, 6 inches."
        },
        {
            state: "Universal",
            type: "CDL Class A",
            q: "Why should you lock the tractor fifth wheel jaws around the kingpin?",
            a: "To ensure the trailer is securely coupled to the tractor and cannot detach during operation."
        },
        {
            state: "Universal",
            type: "CDL Pre-Trip Inspection",
            q: "What do you check for when inspecting slack adjusters and pushrods on Class A/B air brakes?",
            a: "Look for broken, loose, or missing parts. With the wheels chocked and brakes released, the pushrod should not move more than 1 inch when pulled hard by hand."
        },
        {
            state: "Universal",
            type: "CDL Air Brakes",
            q: "At what air pressure system level must the low air pressure warning signal activate?",
            a: "The warning light or buzzer must activate before air pressure drops below 60 PSI."
        }
    ];

    // INITIAL RENDER
    displayCards(masterQuestionBank);

    function displayCards(data) {
        const display = document.getElementById('deckDisplay');
        const summary = document.getElementById('resultsSummary');
        display.innerHTML = "";

        if (data.length === 0) {
            summary.innerText = "0 Matches Found";
            display.innerHTML = `<div class="no-results">No exact matches found in our database. Try checking your spelling or using different keywords.</div>`;
            return;
        }

        summary.innerText = `Showing ${data.length} matched question(s):`;

        data.forEach(item => {
            display.innerHTML += `
                <div class="qa-card">
                    <div class="meta-tags">
                        <span class="tag tag-state">${item.state}</span>
                        <span class="tag tag-type">${item.type}</span>
                    </div>
                    <div class="question-text">${item.q}</div>
                    <div class="answer-heading">Official Verified Answer:</div>
                    <div class="answer-text">${item.a}</div>
                </div>
            `;
        });
    }

    // SEARCH FILTER LOGIC
    function executeSearch() {
        const query = document.getElementById('searchField').value.toLowerCase();
        
        const filteredResults = masterQuestionBank.filter(item => {
            return item.q.toLowerCase().includes(query) || 
                   item.a.toLowerCase().includes(query) || 
                   item.type.toLowerCase().includes(query) ||
                   item.state.toLowerCase().includes(query);
        });

        displayCards(filteredResults);
    }

    // NATIVE BROWSER SPEECH DETECTOR
    function activateVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Your browser does not support live voice recognition APIs. Please switch to Google Chrome.");
            return;
        }

        const recognizer = new SpeechRecognition();
        const mic = document.getElementById('micTrigger');
        const searchInput = document.getElementById('searchField');

        recognizer.lang = 'en-US';
        recognizer.interimResults = false;

        recognizer.onstart = () => {
            mic.classList.add('listening');
            searchInput.placeholder = "Listening closely to your voice...";
        };

        recognizer.onresult = (event) => {
            const vocalInput = event.results[0][0].transcript;
            searchInput.value = vocalInput;
            mic.classList.remove('listening');
            searchInput.placeholder = "Type or speak an exam question here...";
            executeSearch(); // Instantly process the spoken question
        };

        recognizer.onerror = () => {
            mic.classList.remove('listening');
            searchInput.placeholder = "Type or speak an exam question here...";
            alert("Microphone connection failed. Make sure your browser has mic permissions enabled.");
        };

        recognizer.start();
    }
</script>

</body>
</html>
